name: Build Remon Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - '**.html'
      - 'css/**'
      - 'js/**'
      - 'images/**'
      - '.github/workflows/android-app.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Copy website into app
        run: npm run copy:web

      - name: Validate Capacitor setup
        run: npx cap doctor

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          else
            echo "Android platform directory already exists; skipping cap add."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Android outputs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: remon-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: remon-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
