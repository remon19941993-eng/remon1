name: Build Remon Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - '**.html'
      - 'css/**'
      - 'js/**'
      - 'images/**'
      - '.github/workflows/android-app.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Copy website into app
        run: npm run copy:web

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build Android outputs
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleDebug

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: remon-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload Android APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: remon-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
