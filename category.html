  <script src="js/main.js"></script>
  <script>
    var catNames = {
      construction: 'مواد البناء',
      pc: 'كمبيوتر وإلكترونيات',
      fabrics: 'أقمشة وخامات',
      cosmetics: 'مواد التجميل',
      electronics: 'أجهزة إلكترونية',
      fashion: 'أزياء وإكسسوارات'
    };
    var params = new URLSearchParams(window.location.search);
    var cat = params.get('cat') || 'electronics';
    document.getElementById('catTitle').textContent = catNames[cat] || 'التصنيف';

    function renderCat(list) {
      var grid = document.getElementById('catProducts');
      var filtered = (list || []).filter(function(p) { return p.category === cat; });
      if (!filtered.length) {
        grid.innerHTML = '<p style="text-align:center;color:#888;padding:40px;">لا توجد منتجات في هذا التصنيف بعد. كن أول من ينشر!</p>';
        return;
      }
      grid.innerHTML = filtered.map(productCardHtml).join('');
    }

    if (typeof getProducts === 'function') {
      getProducts(cat).then(renderCat).catch(function() { renderCat([]); });
    } else {
      renderCat([]);
    }
  </script>
