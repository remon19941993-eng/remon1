<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-app.js"></script>
  <style>

      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: #1b5e20; color: #fff; padding: 14px 24px; border-radius: 999px;
      font-weight: 700; z-index: 9999; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .toast-ok.show { display: block; }
  </style>
</head>
<body>
  <div class="quran-banner">
    <p class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
    <p class="ayah">فَذَكِّرْ فَمَا أَنتَ بِنِعْمَةِ رَبِّكَ بِكَاهِنٍ وَلَا مَجْنُونٍ</p>
  </div>
  <header class="navbar">
    <div class="container nav-content">
      <div class="logo logo-souqi">
        <svg class="sy-flag-svg" viewBox="0 0 36 24" width="36" height="24" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="8" y="0" fill="#007A3D"/><rect width="36" height="8" y="8" fill="#FFFFFF"/><rect width="36" height="8" y="16" fill="#000000"/><g fill="#CE1126"><polygon points="9,10 9.6,11.8 11.5,11.8 10,12.9 10.6,14.7 9,13.6 7.4,14.7 8,12.9 6.5,11.8 8.4,11.8"/><polygon points="18,10 18.6,11.8 20.5,11.8 19,12.9 19.6,14.7 18,13.6 16.4,14.7 17,12.9 15.5,11.8 17.4,11.8"/><polygon points="27,10 27.6,11.8 29.5,11.8 28,12.9 28.6,14.7 27,13.6 25.4,14.7 26,12.9 24.5,11.8 26.4,11.8"/></g></svg>
        <div class="logo-mark" title="سوقي"><span style="font-size:22px;">🦅</span></div>
        <div class="logo-text"><strong class="brand-name">سوقي</strong><small>سوق إلكتروني</small></div>
        <svg class="sy-flag-svg" viewBox="0 0 36 24" width="36" height="24" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="8" y="0" fill="#007A3D"/><rect width="36" height="8" y="8" fill="#FFFFFF"/><rect width="36" height="8" y="16" fill="#000000"/><g fill="#CE1126"><polygon points="9,10 9.6,11.8 11.5,11.8 10,12.9 10.6,14.7 9,13.6 7.4,14.7 8,12.9 6.5,11.8 8.4,11.8"/><polygon points="18,10 18.6,11.8 20.5,11.8 19,12.9 19.6,14.7 18,13.6 16.4,14.7 17,12.9 15.5,11.8 17.4,11.8"/><polygon points="27,10 27.6,11.8 29.5,11.8 28,12.9 28.6,14.7 27,13.6 25.4,14.7 26,12.9 24.5,11.8 26.4,11.8"/></g></svg>
      </div>
      <nav class="nav-links">
        <a href="index.html">الرئيسية</a>
        <a href="join.html">انضم كتاجر</a>
        <a href="customer.html" class="active">حسابي</a>
        <a href="vendor.html">دخول التاجر</a>
      </nav>
    </div>
  </header>

  <main class="join-page">
    <div class="container">
      <div class="join-card" id="loginBox">
        <div class="join-header">
          <div class="join-icon">👤</div>
          <h1>تسجيل / اشتراك</h1>
          <p class="subtitle">للزبائن — مجاني بالكامل</p>
        </div>
        <button type="button" class="btn btn-outline full" id="googleBtn" onclick="handleCustomerGoogle()">التسجيل / الدخول عبر Google</button>
        <p id="googleStatus" style="text-align:center;color:#888;font-size:13px;margin:10px 0;"></p>
        <p style="text-align:center;color:#888;font-size:13px;margin-bottom:12px;">أو بالبريد وكلمة المرور</p>
        <form id="custForm" onsubmit="handleCustomer(event)">
          <div class="form-group"><label>الاسم</label><input type="text" id="fullName"></div>
          <div class="form-group"><label>البريد</label><input type="email" id="email" required></div>
          <div class="form-group"><label>كلمة المرور</label><input type="password" id="password" required minlength="6"></div>
          <div class="form-group"><label>الهاتف</label><input type="tel" id="phone"></div>
          <button type="submit" class="btn btn-primary full" id="custBtn">تسجيل / دخول</button>
        </form>
      </div>
    </div>
  </main>
  <div class="toast-ok" id="toastOk">✓ تم تسجيل الدخول بنجاح</div>

  <script>
    var finishing = false;

    function showSuccessAndHome() {
      if (finishing) return;
      finishing = true;
      var t = document.getElementById('toastOk');
      if (t) t.classList.add('show');
      setTimeout(function() { location.replace('index.html'); }, 800);
    }

    function resetGoogleBtn() {
      var btn = document.getElementById('googleBtn');
      if (btn) { btn.disabled = false; btn.textContent = 'التسجيل / الدخول عبر Google'; }
      var st = document.getElementById('googleStatus');
      if (st) st.textContent = '';
    }

    async function saveCustomerUser(u, extra) {
      if (!u) return null;
      var id = u.uid || u.id;
      if (!id) return null;
      var payload = {
        fullName: (extra && extra.fullName) || u.displayName || '',
        email: u.email || '',
        phone: (extra && extra.phone) || '',
        photoURL: u.photoURL || '',
        id: id,
        createdAt: new Date().toISOString(),
        type: 'customer'
      };
      try {
        await Promise.race([
          db.collection('customers').doc(id).set(payload, { merge: true }),
          new Promise(function(_, reject) {
            setTimeout(function() { reject(new Error('Firestore timeout')); }, 5000);
          })
        ]);
      } catch (e) {
        console.warn('تعذر حفظ بيانات العميل في Firestore:', e);
      }
      try {
        var local = JSON.parse(localStorage.getItem('local_customers') || '[]');
        local = local.filter(function(c) { return c.id !== id; });
        local.unshift(payload);
        localStorage.setItem('local_customers', JSON.stringify(local.slice(0, 200)));
      } catch (e2) {}
      return payload;
    }

    async function finishCustomerLogin(user, extra) {
      if (!user || finishing) return;

      // تثبيت جلسة العميل والتحويل فوراً؛ Firestore لا يجب أن يمنع تسجيل الدخول.
      try {
        sessionStorage.removeItem('souqi_pending_customer');
        sessionStorage.setItem('souqi_customer', '1');
      } catch (e) {}

      showSuccessAndHome();

      // حفظ بيانات العميل في الخلفية مع مهلة، دون تعطيل التحويل.
      saveCustomerUser(user, extra).catch(function(e) {
        console.warn('Customer profile save failed:', e);
      });
    }

    async function handleCustomer(e) {
      e.preventDefault();
      var btn = document.getElementById('custBtn');
      btn.disabled = true; btn.textContent = 'جاري...';
      var email = document.getElementById('email').value.trim();
      var pass = document.getElementById('password').value;
      var extra = {
        fullName: document.getElementById('fullName').value.trim(),
        phone: document.getElementById('phone').value.trim()
      };
      try {
        var login = await auth.signInWithEmailAndPassword(email, pass);
        await finishCustomerLogin(login.user, extra);
        return;
      } catch (e1) {
        console.warn('Customer sign-in failed:', e1);
        if (e1 && e1.code !== 'auth/user-not-found') {
          var messages = {
            'auth/wrong-password': 'البريد أو كلمة المرور غير صحيحة.',
            'auth/invalid-credential': 'البريد أو كلمة المرور غير صحيحة.',
            'auth/invalid-email': 'البريد الإلكتروني غير صحيح.',
            'auth/too-many-requests': 'تمت محاولات كثيرة. حاول لاحقاً.'
          };
          alert(messages[e1.code] || e1.message || 'تعذر تسجيل الدخول.');
          btn.disabled = false;
          btn.textContent = 'تسجيل / دخول';
          return;
        }
      }
      var result = await registerCustomer(email, pass, extra);
      if (result.success && auth.currentUser) {
        await finishCustomerLogin(auth.currentUser, extra);
        return;
      }
      alert(result.error || 'فشل');
      btn.disabled = false; btn.textContent = 'تسجيل / دخول';
    }

    async function handleCustomerGoogle() {
      var btn = document.getElementById('googleBtn');
      var st = document.getElementById('googleStatus');
      btn.disabled = true;
      btn.textContent = 'جاري التحويل...';
      if (st) st.textContent = 'سيفتح Google الآن...';
      try {
        sessionStorage.setItem('souqi_pending_customer', '1');
        sessionStorage.setItem('souqi_auth_mode', 'customer');
      } catch (e) {}

      // إن كان مسجلاً مسبقاً (مثلاً كتاجر) — سجّله كزبون وأكمل
      if (auth.currentUser) {
        await finishCustomerLogin(auth.currentUser);
        return;
      }

      try {
        var provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        // redirect دائماً على هذه الصفحة — لا popup (يعلق على الجوال)
        await auth.signInWithRedirect(provider);
      } catch (e) {
        alert('خطأ: ' + (e.message || e));
        resetGoogleBtn();
      }
    }

    // معالجة العودة من Google — أول شيء عند تحميل الصفحة
    (async function bootstrap() {
      // 1) نتيجة redirect
      try {
        var res = await auth.getRedirectResult();
        if (res && res.user) {
          await finishCustomerLogin(res.user);
          return;
        }
      } catch (e) {
        console.warn(e);
      }

      // 2) جلسة موجودة بعد pending
      var pending = false;
      try { pending = sessionStorage.getItem('souqi_pending_customer') === '1'; } catch (e) {}
      if (pending && auth.currentUser) {
        await finishCustomerLogin(auth.currentUser);
        return;
      }

      // 3) راقب auth
      auth.onAuthStateChanged(async function(user) {
        if (!user) {
          resetGoogleBtn();
          return;
        }
        var p = false;
        try { p = sessionStorage.getItem('souqi_pending_customer') === '1'; } catch (e) {}
        if (p) await finishCustomerLogin(user);
      });

      // 4) أعد الزر بعد 12 ثانية إن لم ينجح
      setTimeout(function() {
        if (!finishing) {
          try {
            if (sessionStorage.getItem('souqi_pending_customer') === '1' && !auth.currentUser) {
              sessionStorage.removeItem('souqi_pending_customer');
              resetGoogleBtn();
              var st = document.getElementById('googleStatus');
              if (st) st.textContent = 'لم يكتمل Google — جرّب مرة أخرى أو استخدم البريد';
            }
          } catch (e) {}
        }
      }, 12000);
    })();
  </script>
</body>
</html>
