  <main class="join-page">
    <div class="container">
      <div class="join-card">
        <div class="join-header">
          <div class="join-icon">👤</div>
          <h1>تسجيل / اشتراك</h1>
          <p class="subtitle">للزبائن — مجاني بالكامل</p>
        </div>
        <button type="button" class="btn btn-outline full" id="googleBtn" onclick="handleCustomerGoogle()" style="margin-bottom:16px;">التسجيل / الدخول عبر Google</button>
        <form id="custForm" onsubmit="handleCustomer(event)">
          <div class="form-group"><label>الاسم</label><input type="text" id="fullName" required></div>
          <div class="form-group"><label>البريد</label><input type="email" id="email" required></div>
          <div class="form-group"><label>كلمة المرور</label><input type="password" id="password" required minlength="6"></div>
          <div class="form-group"><label>الهاتف</label><input type="tel" id="phone"></div>
          <button type="submit" class="btn btn-primary full" id="custBtn">تسجيل</button>
        </form>
        <div id="okMsg" class="success-message hidden" style="text-align:center;padding:20px;">
          <h3>✅ تم التسجيل بنجاح</h3>
          <a href="index.html" class="btn btn-primary" style="margin-top:12px;">العودة للرئيسية</a>
        </div>
      </div>
    </div>
  </main>
    <script>
    function resetGoogleBtn() {
      var btn = document.getElementById('googleBtn');
      if (btn) { btn.disabled = false; btn.textContent = 'التسجيل / الدخول عبر Google'; }
    }

    async function saveCustomerUser(u) {
      if (!u || !u.uid && !u.id) return;
      var id = u.uid || u.id;
      var payload = {
        fullName: u.displayName || u.fullName || '',
        email: u.email || '',
        id: id,
        createdAt: new Date().toISOString(),
        type: 'customer'
      };
      try { await db.collection('customers').doc(id).set(payload, { merge: true }); } catch (e) {}
      try {
        var local = JSON.parse(localStorage.getItem('local_customers') || '[]');
        local = local.filter(function(c) { return c.id !== id && c.email !== payload.email; });
        local.unshift(payload);
        localStorage.setItem('local_customers', JSON.stringify(local.slice(0, 200)));
      } catch (e2) {}
    }

    async function handleCustomer(e) {
      e.preventDefault();
      var btn = document.getElementById('custBtn');
      btn.disabled = true; btn.textContent = 'جاري التسجيل...';
      var result = await registerCustomer(
        document.getElementById('email').value.trim(),
        document.getElementById('password').value,
        {
          fullName: document.getElementById('fullName').value.trim(),
          phone: document.getElementById('phone').value.trim()
        }
      );
      if (result.success) {
        document.getElementById('custForm').classList.add('hidden');
        document.getElementById('googleBtn').classList.add('hidden');
        document.getElementById('okMsg').classList.remove('hidden');
      } else {
        alert(result.error || 'فشل التسجيل');
        btn.disabled = false; btn.textContent = 'تسجيل';
      }
    }

    async function handleCustomerGoogle() {
      var btn = document.getElementById('googleBtn');
      btn.disabled = true; btn.textContent = 'جاري الاتصال...';
      // إعادة الزر إن لم يكتمل خلال 25 ثانية
      var t = setTimeout(resetGoogleBtn, 25000);
      try {
        var result = await loginWithGoogle({ asCustomer: true });
        if (result.redirecting) return; // سيُعاد تحميل الصفحة
        clearTimeout(t);
        if (result.success) {
          var u = result.user || auth.currentUser;
          await saveCustomerUser(u);
          document.getElementById('custForm').classList.add('hidden');
          btn.classList.add('hidden');
          document.getElementById('okMsg').classList.remove('hidden');
          return;
        }
        alert(result.error || 'فشل');
      } catch (e) {
        clearTimeout(t);
        alert(e.message || 'فشل Google');
      }
      resetGoogleBtn();
    }

    // بعد العودة من Google redirect
    (async function() {
      try {
        var r = await handleGoogleRedirectResult();
        if (r && r.success) {
          var u = r.user || auth.currentUser;
          if (u) {
            await saveCustomerUser(u);
            document.getElementById('custForm').classList.add('hidden');
            var btn = document.getElementById('googleBtn');
            if (btn) btn.classList.add('hidden');
            document.getElementById('okMsg').classList.remove('hidden');
          }
        }
      } catch (e) {}
      resetGoogleBtn();
    })();
  </script>
